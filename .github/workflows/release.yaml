name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  image-build:
    name: Push Container Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get version
        id: get_version
        run: |
          version=${GITHUB_REF#refs/tags/v}
          echo "result=${version}" >> $GITHUB_OUTPUT
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
      - uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
        with:
          bot-id: "${{ vars.TAKUMI_GUARD_BOT_ID }}"
      - name: Export .netrc path for docker build
        # The runner's HOME is not available in the `env` context, so expose it explicitly.
        run: echo "NETRC_PATH=$HOME/.netrc" >> "$GITHUB_ENV"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ofen image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dockerfiles/Dockerfile.imageprefetch-controller
          push: true
          tags: |
            ghcr.io/cybozu-go/ofen:${{steps.get_version.outputs.result}}
          build-args: |
            GOPROXY=${{ env.GOPROXY }}
          secret-files: |
            netrc=${{ env.NETRC_PATH }}
      - name: Build and push ofend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: dockerfiles/Dockerfile.nodeimageset-controller
          push: true
          tags: |
            ghcr.io/cybozu-go/ofend:${{steps.get_version.outputs.result}}
          build-args: |
            GOPROXY=${{ env.GOPROXY }}
          secret-files: |
            netrc=${{ env.NETRC_PATH }}
  release:
    name: Release on GitHub
    needs: image-build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/} # Don't remove "v" prefix.
          if echo ${VERSION} | grep -q -e '-'; then PRERELEASE_FLAG=-p; fi
          gh release create $VERSION $PRERELEASE_FLAG \
            -t "Release $VERSION"  \
            --generate-notes
  chart-release:
    permissions:
      contents: write
    runs-on: "ubuntu-24.04"
    needs: release
    if: contains(needs.release.result, 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create release notes
        env:
          tag_version: ${{ github.ref_name }}
        run: |
          cat <<EOF > ./charts/ofen/RELEASE.md
          Helm chart for ofen [$tag_version](https://github.com/cybozu-go/ofen/releases/tag/$tag_version)

          EOF
      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          config: "cr.yaml"
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
